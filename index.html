<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORBIT 우주 할 일</title>
<meta name="description" content="행성은 카테고리, 위성은 할 일. 실제 행성 사진으로 만든 우주에서 할 일을 태양에 올려 불태우는 투두리스트.">
<meta name="theme-color" content="#04050b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ORBIT">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-view="today">

<main id="stage" aria-label="우주 할 일 지도">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="labels" class="labels"></div>
  <div id="mtags" class="mtags" aria-hidden="true"></div>
  <div id="sunHint" class="sun-hint" hidden></div>
  <div id="focus" class="focus" hidden aria-label="집중 중인 할 일"></div>
  <div id="tooltip" class="tooltip" hidden></div>
</main>

<aside id="board" class="board" aria-label="할 일 보드"></aside>
<button type="button" id="boardPill" class="board-pill" hidden aria-label="오늘 할 일 목록 열기"></button>
<div class="focus-chip" id="focusChip" hidden></div>
<div class="view-ctl" id="viewCtl" role="toolbar" aria-label="시점 조작">
  <button type="button" class="vc-btn vc-zoom" data-vc="in" aria-label="확대" title="확대  +"><span data-ico="plus"></span></button>
  <button type="button" class="vc-btn vc-zoom" data-vc="out" aria-label="축소" title="축소  −"><span data-ico="minus"></span></button>
  <span class="vc-sep" aria-hidden="true"></span>
  <button type="button" class="vc-btn" data-vc="reset" aria-label="전체 보기" title="전체 보기  0"><span data-ico="fit"></span></button>
  <button type="button" class="vc-btn" data-vc="spin" id="vcSpin" aria-label="자동 회전" title="자동 회전  R"><span data-ico="pause"></span></button>
  <button type="button" class="vc-btn" data-vc="help" aria-label="조작 안내" title="조작 안내  ?"><span data-ico="help"></span></button>
</div>
<div class="coach" id="coach" hidden role="dialog" aria-label="조작 안내"></div>

<header class="topbar">
  <div class="tb-left">
    <div class="brand" aria-label="ORBIT">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="3.6" fill="#f4a259"/><ellipse cx="11" cy="11" rx="9.4" ry="4" transform="rotate(-24 11 11)" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="1.2"/><circle cx="19.2" cy="7.6" r="1.5" fill="currentColor"/></svg>
      <span>Orbit</span>
    </div>
    <span class="tb-div" aria-hidden="true"></span>
    <div class="today"><div class="today-date" id="todayDate">오늘</div><div class="today-sub" id="todaySub"></div></div>
  </div>
  <nav class="seg" id="seg" role="tablist" aria-label="보기 전환">
    <button type="button" class="seg-btn" data-view="today" role="tab">오늘</button>
    <button type="button" class="seg-btn" data-view="all" role="tab">전체</button>
    <button type="button" class="seg-btn" data-view="list" role="tab">목록</button>
    <button type="button" class="seg-btn" data-view="calendar" role="tab">캘린더</button>
    <span class="seg-thumb" aria-hidden="true"></span>
  </nav>
  <div class="tb-right">
    <button type="button" class="search-btn" id="searchBtn" aria-label="할 일 검색"><span data-ico="search"></span><span class="lbl">검색</span><kbd>/</kbd></button>
    <button type="button" class="ring-btn" id="progressBtn" aria-label="오늘의 미션 열기">
      <svg viewBox="0 0 40 40" width="22" height="22" aria-hidden="true"><circle class="ring-bg" cx="20" cy="20" r="16.5"></circle><circle class="ring-fg" id="progressRing" cx="20" cy="20" r="16.5"></circle></svg>
      <span class="ring-num" id="progressText">0</span>
    </button>
    <button type="button" class="icon-btn" id="settingsBtn" aria-label="행성 관리와 설정" title="설정"><span data-ico="sliders"></span></button>
  </div>
</header>

<section id="listView" class="listview" hidden aria-label="모든 할 일 목록"></section>
<section id="nowbar" class="nowbar" hidden aria-label="지금 집중 중"></section>
<section id="calendar" class="calendar" hidden aria-label="캘린더">
  <div class="cal-head">
    <div><h2 class="cal-title" id="calTitle"></h2><p class="cal-sub" id="calSub"></p></div>
    <div class="cal-nav">
      <div class="cal-seg" id="calMode" role="tablist" aria-label="캘린더 보기"><button type="button" data-mode="month" role="tab">월</button><button type="button" data-mode="week" role="tab">주</button></div>
      <button type="button" class="icon-btn sm" id="calPrev" aria-label="이전 달"><span data-ico="chevLeft"></span></button>
      <button type="button" class="pill-btn" id="calToday">오늘</button>
      <button type="button" class="icon-btn sm" id="calNext" aria-label="다음 달"><span data-ico="chevRight"></span></button>
    </div>
  </div>
  <div class="cal-weekdays" aria-hidden="true"><span class="sun-d">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat-d">토</span></div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="cal-foot" id="calFoot"></div>
</section>

<form id="cmd" class="cmd" autocomplete="off">
  <button type="button" class="cmd-planet" id="cmdPlanet" aria-label="행성 선택"></button>
  <input id="cmdInput" type="text" enterkeyhint="send" placeholder="새 할 일" aria-label="새 할 일">
  <button type="button" class="cmd-chip prio" id="cmdPrio" aria-label="우선순위"></button>
  <button type="button" class="cmd-chip" id="cmdDate" aria-label="마감일"><span data-ico="calendar"></span><span class="txt">오늘</span></button>
  <button type="submit" class="cmd-go" aria-label="추가"><span data-ico="plus"></span></button>
  <div class="pop" id="popPlanet" hidden></div>
  <div class="pop" id="popDate" hidden></div>
  <div class="pop" id="popPrio" hidden></div>
</form>

<aside id="sheet" class="sheet" hidden aria-label="상세 패널">
  <div class="sheet-grip" id="sheetGrip" aria-hidden="true"><i></i></div>
  <div class="sheet-inner" id="sheetInner"></div>
</aside>

<div id="palette" class="palette" hidden>
  <div class="pal-backdrop" data-close></div>
  <div class="pal-card" role="dialog" aria-modal="true" aria-label="검색">
    <label class="pal-field"><span data-ico="search"></span><input id="palInput" type="search" placeholder="할 일, 메모 검색" autocomplete="off" aria-label="검색어"><kbd>Esc</kbd></label>
    <div class="pal-list" id="palList"></div>
  </div>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="dragGhost" class="drag-ghost" hidden></div>

<script>if (location.protocol === "file:") document.write('<script src="js/textures-inline.js"><\/script>');</script>
<script src="js/utils.js"></script>
<script src="js/bodies.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/gl.js"></script>
<script src="js/gl3d.js"></script>
<script src="js/fx.js"></script>
<script src="js/scene.js"></script>
<script src="js/panel.js"></script>
<script src="js/calendar.js"></script>
<script src="js/calsync.js"></script>
<script src="js/board.js"></script>
<script src="js/now.js"></script>
<script src="js/listview.js"></script>
<script src="js/app.js"></script>
</body>
</html>
